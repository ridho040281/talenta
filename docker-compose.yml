version: '3.8'

services:
  # Laravel Application (PHP 8.3 FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talenta_app
    restart: unless-stopped
    working_dir: /var/www/talenta
    volumes:
      - .:/var/www/talenta
      - /var/www/talenta/vendor
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - talenta_network
    depends_on:
      - db

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: talenta_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/talenta
      - ./deploy/nginx/talenta.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - talenta_network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: talenta_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: talenta_db
      MYSQL_USER: talenta_user
      MYSQL_PASSWORD: talenta_password
      MYSQL_ROOT_PASSWORD: root_secure_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - talenta_network

  # Queue Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talenta_worker
    restart: unless-stopped
    command: php /var/www/talenta/artisan queue:work --sleep=3 --tries=3
    volumes:
      - .:/var/www/talenta
    networks:
      - talenta_network
    depends_on:
      - app
      - db

networks:
  talenta_network:
    driver: bridge

volumes:
  db_data:
    driver: local